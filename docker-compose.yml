version: "3.8"

name: mangament-fullstack

services:
  # ==========================================
  # REVERSE PROXY & SSL (CADDY)
  # ==========================================
  caddy:
    image: caddy:2-alpine
    container_name: mangament_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Hỗ trợ HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - mangament_caddy_data:/data
      - mangament_caddy_config:/config
    depends_on:
      - api
      - client-web
      - client-admin

  # ==========================================
  # DYNAMIC DNS (CLOUDFLARE)
  # ==========================================
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:latest
    container_name: mangament_ddns
    restart: always
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - DOMAINS=mangament.io.vn,www.mangament.io.vn,admin.mangament.io.vn,api.mangament.io.vn
      - PROXIED=false # Giữ DNS Only (đám mây xám) để đạt tốc độ upload tối đa

  # ==========================================
  # FRONTEND CLIENTS (NEXT.JS STANDALONE)
  # ==========================================
  client-web:
    container_name: mangament_client_web
    build:
      context: ./client
      dockerfile: Dockerfile.web
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=https://api.mangament.io.vn
      - NEXT_PUBLIC_WEB_URL=https://mangament.io.vn
      - NEXT_PUBLIC_ADMIN_URL=https://admin.mangament.io.vn
    depends_on:
      - api

  client-admin:
    container_name: mangament_client_admin
    build:
      context: ./client
      dockerfile: Dockerfile.admin
    restart: always
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXT_PUBLIC_API_URL=https://api.mangament.io.vn
      - NEXT_PUBLIC_ADMIN_URL=https://admin.mangament.io.vn
      - NEXT_PUBLIC_WEB_URL=https://mangament.io.vn
    depends_on:
      - api

  # ==========================================
  # BACKEND SERVICES
  # ==========================================
  api:
    container_name: mangament_api
    image: kozkhoa/mangament-server-api:latest
    build:
      context: ./server/api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - ./server/api/.env.production
    environment:
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - MONGODB_CONNECTION_STRING=mongodb://admin:password@logs-db:27017/management_logs?authSource=admin
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mangament_postgres_db}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mangament_postgres_db}?schema=public
      - PUBLIC_DIR=/app/public
      - TEMP_DIR=/app/temp
    volumes:
      - ${PUBLIC_DIR:-/mnt/hdd1/public}:/app/public
      - ${TEMP_DIR:-/mnt/hdd1/temp}:/app/temp
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  worker:
    container_name: mangament_worker
    image: kozkhoa/mangament-server-worker:latest
    build:
      context: ./server/api
      dockerfile: worker/Dockerfile
    restart: always
    env_file:
      - ./server/api/.env.production
    environment:
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - MONGODB_CONNECTION_STRING=mongodb://admin:password@logs-db:27017/management_logs?authSource=admin
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mangament_postgres_db}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mangament_postgres_db}?schema=public
      - PUBLIC_DIR=/app/public
      - TEMP_DIR=/app/temp
    volumes:
      - ${PUBLIC_DIR:-/mnt/hdd1/public}:/app/public
      - ${TEMP_DIR:-/mnt/hdd1/temp}:/app/temp
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      api:
        condition: service_started

  ml-service:
    container_name: mangament_ml_service
    image: kozkhoa/mangament-server-ml-service:latest
    build:
      context: ./server/ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # DATABASES & CACHE
  # ==========================================
  db:
    container_name: mangament_db
    image: pgvector/pgvector:pg16
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mangament_postgres_db}
    ports:
      - "5432:5432"
    volumes:
      - mangament_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mangament_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mangament_redis
    restart: always
    ports:
      - "6378:6379"
    volumes:
      - mangament_redis_data:/data

  logs-db:
    container_name: mangament_logs_db
    image: mongo:8
    restart: always
    ports:
      - "27016:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mangament_logs_db_data:/data/db

# ==========================================
# VOLUMES
# ==========================================
volumes:
  mangament_db_data:
  mangament_redis_data:
  mangament_logs_db_data:
  mangament_caddy_data:
  mangament_caddy_config:
