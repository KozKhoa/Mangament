# Docker Compose for Mangament Server

services:
  redis:
    image: redis:7-alpine
    container_name: mangament_redis
    restart: always
    ports:
      - "6378:6379" # <host>:<container>

  nginx:
    image: jc21/nginx-proxy-manager:latest
    container_name: mangament_nginx
    restart: always
    ports:
      - "81:81"   # Cổng vào giao diện Web UI Quản trị (Chỉ mở nội bộ)
      - "80:80"   # Mở cổng 80 ra ngoài cho HTTP
      - "443:443" # Mở cổng 443 ra ngoài cho HTTPS (chuẩn bị trước)
    volumes:
      - ./npm/data:/data
      - ./npm/letsencrypt:/etc/letsencrypt
    depends_on:
      - api 
      
  cloudflare-tunnel:
    container_name: mangament_cloudflared_tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    env_file:
      - ./api/.env
    depends_on:
      - nginx # hoặc service nodejs của bạn để đảm bảo mạng nội bộ đã sẵn sàng
      - api

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: mangament_ml_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mangament_api
    restart: always
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - ./api/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - MONGODB_CONNECTION_STRING=mongodb://admin:password@logs-db:27017/management_logs?authSource=admin
    depends_on:
      - redis
    volumes:
      - ./api:/app
      - /app/node_modules
      - ../uploads:/app/uploads

  worker:
    build:
      context: ./api
      dockerfile: workers/Dockerfile
    container_name: mangament_worker
    restart: always
    env_file:
      - ./api/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - MONGODB_CONNECTION_STRING=mongodb://admin:password@logs-db:27017/management_logs?authSource=admin
    depends_on:
      - redis
      - ml-service
      - api

  logs-db:
    image: mongo:8
    container_name: mangament_logs_db
    restart: always
    ports:
      - "27016:27017"
    env_file:
      - ./api/.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mangament_logs_db_data:/data/db

volumes:
  mangament_logs_db_data:
