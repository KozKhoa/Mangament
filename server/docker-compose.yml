# Docker Compose for Mangament Server

services:
  redis:
    image: redis:7-alpine
    container_name: mangament_redis
    restart: always
    ports:
      - "6378:6379" # <host>:<container>

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: mangament_ml_service
    restart: no
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: mangament_api
    restart: always
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - ./api/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      redis:
        condition: service_started
    volumes:
      - ./api:/app
      - /app/node_modules
      - ../uploads:/app/uploads

  worker:
    build:
      context: ./api
      dockerfile: workers/Dockerfile
    container_name: mangament_worker
    env_file:
      - ./api/.env
    environment:
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
    depends_on:
      - redis
      - ml-service
      - api
