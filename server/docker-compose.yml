version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: mangament_redis
    restart: always
    ports:
      - "6378:6379"

  cloudflare-tunnel:
    container_name: mangament_cloudflared_tunnel
    image: cloudflare/cloudflared:latest
    restart: always
    command: tunnel --no-autoupdate run
    env_file:
      - ./api/.env.production
    depends_on:
      - api

  ml-service:
    container_name: mangament_ml_service
    # THAY build BẰNG image TRÊN DOCKER HUB
    image: kozkhoa/mangament-server-ml-service:latest
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"

  db:
    container_name: mangament_db
    image: pgvector/pgvector:pg16
    restart: always
    env_file:
      - ./api/.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-posgresql}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-posgresql}
      POSTGRES_DB: ${POSTGRES_DB:-management_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - mangament_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-posgresql} -d $${POSTGRES_DB:-posgresql}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    container_name: mangament_api # Đã sửa dấu : thành _
    # THAY build BẰNG image TRÊN DOCKER HUB
    image: kozkhoa/mangament-server-api:latest
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    env_file:
      - ./api/.env.production
    environment:
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - MONGODB_CONNECTION_STRING=mongodb://admin:password@logs-db:27017/management_logs?authSource=admin # if you wanna use local mongodb
      - DATABASE_URL=postgresql://${POSTGRES_USER:-posgresql}:${POSTGRES_PASSWORD:-posgresql}@db:5432/${POSTGRES_DB:-management_db}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-posgresql}:${POSTGRES_PASSWORD:-posgresql}@db:5432/${POSTGRES_DB:-management_db}?schema=public
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
    volumes:
      # BỎ MOUNT CODE ĐÈ VÀO /app, CHỈ GIỮ LẠI THƯ MỤC UPLOADS ĐỂ LƯU TRỮ ẢNH MANGA
      - ../uploads:/app/uploads

  worker:
    container_name: mangament_worker # Đã sửa dấu : thành _
    # THAY build BẰNG image TRÊN DOCKER HUB
    image: kozkhoa/mangament-server-worker:latest
    build:
      context: ./api
      dockerfile: worker/Dockerfile
    restart: always
    env_file:
      - ./api/.env.production
    environment:
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - MONGODB_CONNECTION_STRING=mongodb://admin:password@logs-db:27017/management_logs?authSource=admin # if you wanna use local mongodb
      - DATABASE_URL=postgresql://${POSTGRES_USER:-posgresql}:${POSTGRES_PASSWORD:-posgresql}@db:5432/${POSTGRES_DB:-management_db}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-posgresql}:${POSTGRES_PASSWORD:-posgresql}@db:5432/${POSTGRES_DB:-management_db}?schema=public
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      api:
        condition: service_started

  logs-db:
    container_name: mangament_logs_db
    image: mongo:8
    restart: always
    ports:
      - "27016:27017"
    env_file:
      - ./api/.env.production
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
    volumes:
      - mangament_logs_db_data:/data/db

volumes:
  mangament_logs_db_data:
  mangament_db_data:
