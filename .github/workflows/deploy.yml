name: Auto Deploy

on:
  push:
    branches:
      - main
    paths:
      # Cập nhật chính xác các path cần theo dõi để kích hoạt workflow
      - "server/api/**"
      - "server/ml-service/**"
      - "server/deploy/**"
      - ".github/workflows/**"

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for api changes
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: server/api/**

      # Các bước cài đặt môi trường ĐỨNG TRONG JOB để máy ảo này có hiệu lực
      - name: Set up QEMU
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push API
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./server/api
          file: ./server/api/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mangament-server-api:latest

  build-and-push-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for worker changes
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: |
            server/api/worker/**
            server/api/WorkerApp.js
            server/api/configs/**
            server/api/src/**
            server/api/prisma/**
            server/api/package*.json

      - name: Set up QEMU
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Worker
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./server/api
          file: ./server/api/worker/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mangament-server-worker:latest

  build-and-push-ml-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for ml-service changes
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files: server/ml-service/**

      - name: Set up QEMU
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push ML Service
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./server/ml-service
          file: ./server/ml-service/Dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mangament-server-ml-service:latest

  deploy:
    if: |
      always() &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    needs:
      [build-and-push-api, build-and-push-worker, build-and-push-ml-service]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Connect to Tailscale (OIDC Workload Identity Federation)
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OIDC_CLIENT_ID || secrets.TS_OAUTH_CLIENT_ID || secrets.TS_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: ${{ vars.TS_TAGS || secrets.TS_TAGS || 'tag:ci' }}

      - name: Sync server/.env file to VM
        env:
          SERVER_ENV: ${{ secrets.SERVER_ENV || secrets.API_ENV || secrets.SERVER_API_ENV || secrets.ENV_FILE }}
        run: |
          if [ -n "$SERVER_ENV" ]; then
            echo "Syncing environment file to /home/khoa/Mangament/server/deploy/.env..."
            printf '%s\n' "$SERVER_ENV" | ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} 'mkdir -p /home/khoa/Mangament/server/deploy && cat > /home/khoa/Mangament/server/deploy/.env && chmod 600 /home/khoa/Mangament/server/deploy/.env'
          else
            echo "Notice: No SERVER_ENV secret provided. Retaining existing server/deploy/.env on VM."
          fi

      - name: Deploy via Tailscale SSH
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            set -e
            cd /home/khoa/Mangament/server
            git pull origin main
            cd deploy
            docker compose pull
            docker compose up -d
          EOF
