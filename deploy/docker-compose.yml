name: mangament-fullstack

services:
  # ==========================================
  # REVERSE PROXY & SSL (CADDY)
  # ==========================================
  caddy:
    image: caddy:2-alpine
    container_name: mangament_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # Hỗ trợ HTTP/3 (QUIC)
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - mangament_caddy_data:/data
      - mangament_caddy_config:/config
    depends_on:
      - api
      - client-web
      - client-admin
      - client-auth

  # ==========================================
  # DYNAMIC DNS (CLOUDFLARE)
  # ==========================================
  cloudflare-ddns:
    image: favonia/cloudflare-ddns:1
    container_name: mangament_ddns
    restart: always
    env_file:
      - ./.env
    environment:
      - CLOUDFLARE_API_TOKEN=${CLOUDFLARE_API_TOKEN:-}
      - DOMAINS=mangament.io.vn,www.mangament.io.vn,admin.mangament.io.vn,api.mangament.io.vn,auth.mangament.io.vn
      - PROXIED=false # Giữ DNS Only (đám mây xám) để đạt tốc độ upload tối đa
      - IP6_PROVIDER=none

  # ==========================================
  # FRONTEND CLIENTS (NEXT.JS STANDALONE)
  # ==========================================
  client-auth:
    container_name: mangament_client_auth
    image: kozkhoa/mangament-client-auth:latest
    build:
      context: ../client
      dockerfile: Dockerfile.auth
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL:-}
        - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL:-}
        - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL:-}
        - NEXT_PUBLIC_CDN_URL=${NEXT_PUBLIC_CDN_URL:-}
        - NEXT_PUBLIC_LOCAL_CDN_URL=${NEXT_PUBLIC_LOCAL_CDN_URL:-}
        - NEXT_PUBLIC_R2_CDN_URL=${NEXT_PUBLIC_R2_CDN_URL:-}
        - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY:-}
        - NEXT_PUBLIC_COOKIE_DOMAIN=${NEXT_PUBLIC_COOKIE_DOMAIN:-}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: always
    ports:
      - "3003:3003"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=3003
      - NEXTAUTH_URL=https://auth.mangament.io.vn
    depends_on:
      - api

  client-web:
    container_name: mangament_client_web
    image: kozkhoa/mangament-client-web:latest
    build:
      context: ../client
      dockerfile: Dockerfile.web
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL:-}
        - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL:-}
        - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL:-}
        - NEXT_PUBLIC_CDN_URL=${NEXT_PUBLIC_CDN_URL:-}
        - NEXT_PUBLIC_LOCAL_CDN_URL=${NEXT_PUBLIC_LOCAL_CDN_URL:-}
        - NEXT_PUBLIC_R2_CDN_URL=${NEXT_PUBLIC_R2_CDN_URL:-}
        - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY:-}
        - NEXT_PUBLIC_COOKIE_DOMAIN=${NEXT_PUBLIC_COOKIE_DOMAIN:-}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXTAUTH_URL=https://mangament.io.vn
    depends_on:
      - api

  client-admin:
    container_name: mangament_client_admin
    image: kozkhoa/mangament-client-admin:latest
    build:
      context: ../client
      dockerfile: Dockerfile.admin
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_ADMIN_URL=${NEXT_PUBLIC_ADMIN_URL:-}
        - NEXT_PUBLIC_WEB_URL=${NEXT_PUBLIC_WEB_URL:-}
        - NEXT_PUBLIC_AUTH_URL=${NEXT_PUBLIC_AUTH_URL:-}
        - NEXT_PUBLIC_CDN_URL=${NEXT_PUBLIC_CDN_URL:-}
        - NEXT_PUBLIC_LOCAL_CDN_URL=${NEXT_PUBLIC_LOCAL_CDN_URL:-}
        - NEXT_PUBLIC_R2_CDN_URL=${NEXT_PUBLIC_R2_CDN_URL:-}
        - NEXT_PUBLIC_API_KEY=${NEXT_PUBLIC_API_KEY:-}
        - NEXT_PUBLIC_COOKIE_DOMAIN=${NEXT_PUBLIC_COOKIE_DOMAIN:-}
        - NEXT_PUBLIC_GOOGLE_CLIENT_ID=${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: always
    ports:
      - "3001:3001"
    env_file:
      - ./.env
    environment:
      - NODE_ENV=production
      - PORT=3001
      - NEXTAUTH_URL=https://admin.mangament.io.vn
    depends_on:
      - api

  # ==========================================
  # BACKEND SERVICES
  # ==========================================
  api:
    container_name: mangament_api
    image: kozkhoa/mangament-server-api:latest
    build:
      context: ../server/api
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${APP_PORT:-5000}:5000"
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - MONGODB_CONNECTION_STRING=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@logs-db:27017/management_logs?authSource=admin
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mangament_postgres_db}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mangament_postgres_db}?schema=public
      - PUBLIC_DIR=/app/public
      - TEMP_DIR=/app/temp
    volumes:
      - ${PUBLIC_DIR:-/mnt/hdd1/public}:/app/public
      - ${TEMP_DIR:-/mnt/hdd1/temp}:/app/temp
      - ./.env:/app/.env.production:ro
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy

  worker:
    container_name: mangament_worker
    image: kozkhoa/mangament-server-worker:latest
    build:
      context: ../server/api
      dockerfile: worker/Dockerfile
    restart: always
    env_file:
      - ./.env
    environment:
      - REDIS_URL=redis://redis:6379
      - ML_SERVICE_URL=http://ml-service:8000
      - MONGODB_CONNECTION_STRING=mongodb://${MONGO_USERNAME:-admin}:${MONGO_PASSWORD:-password}@logs-db:27017/management_logs?authSource=admin
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mangament_postgres_db}?schema=public
      - DIRECT_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-mangament_postgres_db}?schema=public
      - PUBLIC_DIR=/app/public
      - TEMP_DIR=/app/temp
    volumes:
      - ${PUBLIC_DIR:-/mnt/hdd1/public}:/app/public
      - ${TEMP_DIR:-/mnt/hdd1/temp}:/app/temp
      - ./.env:/app/.env.production:ro
      - ./.env:/app/.env:ro
    depends_on:
      redis:
        condition: service_started
      db:
        condition: service_healthy
      api:
        condition: service_started

  ml-service:
    container_name: mangament_ml_service
    image: kozkhoa/mangament-server-ml-service:latest
    build:
      context: ../server/ml-service
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================
  # DATABASES & CACHE
  # ==========================================
  db:
    container_name: mangament_db
    image: pgvector/pgvector:pg16
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-mangament_postgres_db}
    ports:
      - "5432:5432"
    volumes:
      - mangament_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d ${POSTGRES_DB:-mangament_postgres_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mangament_redis
    restart: always
    ports:
      - "6378:6379"
    volumes:
      - mangament_redis_data:/data

  logs-db:
    container_name: mangament_logs_db
    image: mongo:8
    restart: always
    ports:
      - "27016:27017"
    env_file:
      - ./.env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-password}
    volumes:
      - mangament_logs_db_data:/data/db

# ==========================================
# VOLUMES
# ==========================================
volumes:
  mangament_db_data:
  mangament_redis_data:
  mangament_logs_db_data:
  mangament_caddy_data:
  mangament_caddy_config:
